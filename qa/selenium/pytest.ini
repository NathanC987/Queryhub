[pytest]
addopts = -ra
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    blackbox_ep: Black-box testing using equivalence partitioning
    blackbox_bva: Black-box testing using boundary value analysis
    whitebox_basis: White-box basis path testing (UI-observable control paths)
    smoke: Basic sanity coverage
